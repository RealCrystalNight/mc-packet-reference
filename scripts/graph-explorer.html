<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 1.8.9 Class Explorer — Interactive Source Graph</title>
<meta name="description" content="Progressive interactive graph of the Minecraft 1.8.9 codebase. Start from the protocol core, then enable packages and classes one by one to trace calls, imports and inheritance to the source.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0a0a0a">
<link rel="canonical" href="__SITE__/source/graph/classes.html">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="__PREFIX__css/style.css">
<style>
  html,body{height:100%;}
  body{margin:0;display:flex;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);overflow:hidden;}
  #panel{width:296px;min-width:296px;height:100vh;overflow-y:auto;background:var(--bg-secondary);border-right:1px solid var(--border);padding:14px 14px 28px;font-size:0.82rem;}
  #panel h1{font-size:0.95rem;font-weight:600;margin:6px 0 2px;}
  #panel .back{font-size:0.72rem;color:var(--accent);text-decoration:none;}
  .navlinks{font-size:0.72rem;color:var(--text-muted);margin-bottom:8px;}
  .navlinks a{color:var(--accent);text-decoration:none;}
  .navlinks a:hover{text-decoration:underline;}
  #panel .sub{font-size:0.72rem;color:var(--text-muted);line-height:1.5;margin-bottom:10px;}
  .sec{border-top:1px solid var(--border-subtle);padding:12px 0;}
  .sec>label{display:block;font-size:0.66rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:7px;}
  .btns{display:flex;flex-wrap:wrap;gap:6px;}
  .btn{font-size:0.72rem;font-family:var(--font-sans);background:var(--bg-tertiary);border:1px solid var(--border);color:var(--text-secondary);border-radius:6px;padding:5px 10px;cursor:pointer;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  input[type=search],input[type=text]{width:100%;box-sizing:border-box;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:7px 10px;font-size:0.8rem;font-family:var(--font-sans);outline:none;}
  input:focus{border-color:var(--accent);}
  .list{max-height:260px;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;gap:2px;}
  .list.tall{max-height:340px;}
  .item{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:5px;cursor:pointer;font-size:0.76rem;}
  .item:hover{background:var(--bg-hover);}
  .item input{accent-color:var(--accent);margin:0;flex-shrink:0;}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);}
  .item .ct{color:var(--text-muted);font-size:0.66rem;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:8px;padding:0 6px;flex-shrink:0;}
  .relchips{display:flex;flex-wrap:wrap;gap:5px;}
  .rel{font-size:0.68rem;font-family:var(--font-mono);border:1px solid var(--border);border-radius:999px;padding:2px 9px;cursor:pointer;color:var(--text-muted);user-select:none;}
  .rel.on{color:#fff;}
  #stage{position:relative;flex:1;min-width:0;height:100vh;background:radial-gradient(circle at 50% 40%,#0e1420 0%,var(--bg-primary) 70%);}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;}
  #cv.grabbing{cursor:grabbing;}
  #hint{position:absolute;left:14px;bottom:12px;font-size:0.7rem;color:var(--text-muted);background:rgba(10,10,10,.72);border:1px solid var(--border);border-radius:6px;padding:6px 10px;pointer-events:none;max-width:60%;}
  #stat{position:absolute;right:14px;top:12px;font-size:0.72rem;color:var(--text-secondary);background:rgba(10,10,10,.72);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:var(--font-mono);}
  #card{position:absolute;right:14px;bottom:14px;width:280px;background:rgba(17,17,17,.96);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:0.78rem;box-shadow:0 10px 30px rgba(0,0,0,.5);}
  #card h3{font-family:var(--font-mono);font-size:0.88rem;margin:0 0 4px;}
  #card .pkg{font-family:var(--font-mono);font-size:0.68rem;color:var(--text-muted);word-break:break-all;margin-bottom:8px;}
  #card a.src{display:inline-block;background:var(--accent);color:#fff;font-size:0.74rem;font-weight:500;padding:5px 12px;border-radius:6px;margin-bottom:8px;text-decoration:none;}
  #card a.src:hover{background:var(--accent-hover);text-decoration:none;}
  #card .srcwrap{font-size:0.7rem;color:var(--text-muted);margin-bottom:8px;}
  #card .nbr{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow-y:auto;}
  #card .nbr span{font-family:var(--font-mono);font-size:0.68rem;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:999px;padding:2px 8px;cursor:pointer;color:var(--text-secondary);}
  #card .nbr span:hover{border-color:var(--accent);color:var(--accent);}
  #card .close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text-muted);font-size:0.9rem;background:none;border:none;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:0.85rem;background:var(--bg-primary);}
  #toggle-panel{display:none;position:absolute;left:10px;top:10px;z-index:5;background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;padding:6px 9px;cursor:pointer;}
  @media (max-width:820px){#panel{position:absolute;left:0;top:0;z-index:6;transform:translateX(-100%);transition:transform .2s;}#panel.open{transform:none;}#toggle-panel{display:block;}#card{left:10px;right:10px;width:auto;}}
</style>
</head>
<body>
<aside id="panel">
  <div class="navlinks"><a href="__PREFIX__source/">Source Browser</a> · <a href="__PREFIX__source/graph/">Code Graph</a> · <a href="__PREFIX__">Home</a></div>
  <h1>Class Explorer</h1>
  <p class="sub">Start small, then add packages and classes. Click any node to see its edges and open the source.</p>
  <div class="sec">
    <label>Presets</label>
    <div class="btns">
      <button class="btn primary" id="btn-core">Protocol core</button>
      <button class="btn" id="btn-network">+ network pkg</button>
      <button class="btn" id="btn-clear">Clear</button>
      <button class="btn" id="btn-fit">Fit view</button>
    </div>
  </div>
  <div class="sec">
    <label>Find a class</label>
    <input type="search" id="search" placeholder="NetHandler, EntityPlayer, Packet…" autocomplete="off">
    <div class="list" id="results"></div>
  </div>
  <div class="sec">
    <label>Packages <span id="pkgcount" style="color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0"></span></label>
    <input type="search" id="pkgfilter" placeholder="filter packages…" autocomplete="off">
    <div class="list tall" id="packages"></div>
  </div>
  <div class="sec">
    <label>Edges (relation)</label>
    <div class="relchips" id="rels"></div>
  </div>
</aside>
<main id="stage">
  <button id="toggle-panel" aria-label="Toggle panel">☰</button>
  <canvas id="cv"></canvas>
  <div id="stat">loading…</div>
  <div id="hint">Drag = pan · Scroll = zoom · Click a class for details · Double-click opens its source page · Add packages on the left</div>
  <div id="card" hidden><button class="close" id="card-close">×</button><div id="card-body"></div></div>
  <div id="loading">Loading class graph…</div>
</main>
<script>
(function () {
  'use strict';
  var CORE = __CORE__;
  var REL_COLOR = { calls:'#3b82f6', imports:'#22c55e', inherits:'#f97316', implements:'#a855f7', references:'#6b7280', method:'#14b8a6', contains:'#4b5563', case_of:'#ec4899' };
  var ALL_RELS = Object.keys(REL_COLOR);

  var G = null, byId = {}, pkgNodes = {}, pkgOrder = [], positions = {}, nodes = [], links = [];
  var visible = new Set();
  var rels = new Set(ALL_RELS);
  var view = { scale: 1, tx: 0, ty: 0 };
  var hover = null, selected = null, dragNode = null, panning = null, moved = false;

  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var statEl = document.getElementById('stat'), resultsEl = document.getElementById('results');

  function slug(f) { return f.replace(/\.java$/, ''); }
  function srcUrl(f) { return '../' + slug(f) + '/'; }
  function communityColor(c) { var h = (c * 47) % 360; return 'hsl(' + h + ',65%,62%)'; }
  function radius(n) { return Math.max(3, Math.min(12, 3 + Math.log2((n.degree || 0) + 1))); }

  function body(n) { var parts = n.package.split('.'); return parts.length > 1 ? parts[parts.length - 1] : 'default'; }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
    cv._dpr = dpr; requestDraw();
  }

  // Deterministic package-grouped layout: no running simulation, so no lag.
  function layout() {
    var cols = Math.ceil(Math.sqrt(pkgOrder.length)) || 1, cell = 460;
    pkgOrder.forEach(function (p, i) {
      p._cx = (i % cols) * cell; p._cy = Math.floor(i / cols) * cell;
      p._idx = 0;
    });
    nodes.forEach(function (n) {
      var p = n.package;
      if (!p._cx && p._cx !== 0) { p._cx = 0; p._cy = 0; p._idx = 0; }
      var members = pkgNodes[p] || [];
      var k = p._idx++, m = members.length;
      var a = k * 2.399963, r = m > 1 ? Math.min(170, 16 * Math.sqrt(m)) * Math.sqrt((k + 0.5) / m) : 0;
      positions[n.file] = { x: p._cx + Math.cos(a) * r, y: p._cy + Math.sin(a) * r };
    });
  }

  function visibleNodes() { return nodes.filter(function (n) { return visible.has(n.file); }); }
  function visibleLinks() {
    return links.filter(function (l) { return visible.has(l.source) && visible.has(l.target) && rels.has(l.relation); });
  }

  function neighborsOf(file) {
    var out = [];
    links.forEach(function (l) {
      if (!rels.has(l.relation)) return;
      if (l.source === file) out.push({ file: l.target, relation: l.relation, weight: l.weight });
      else if (l.target === file) out.push({ file: l.source, relation: l.relation, weight: l.weight });
    });
    return out.sort(function (a, b) { return (b.weight || 0) - (a.weight || 0); });
  }

  function requestDraw() {
    if (cv._raf) return;
    cv._raf = requestAnimationFrame(function () { cv._raf = 0; draw(); });
  }

  function draw() {
    var dpr = cv._dpr || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr);
    ctx.save();
    ctx.translate(view.tx, view.ty); ctx.scale(view.scale, view.scale);
    var vn = visibleNodes(), vset = new Set(vn.map(function (n) { return n.file; }));
    var nbr = selected ? new Set(neighborsOf(selected).map(function (x) { return x.file; })) : null;

    links.forEach(function (l) {
      if (!rels.has(l.relation) || !vset.has(l.source) || !vset.has(l.target)) return;
      var a = positions[l.source], b = positions[l.target]; if (!a || !b) return;
      var touches = selected && (l.source === selected || l.target === selected);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = REL_COLOR[l.relation] || '#6b7280';
      ctx.globalAlpha = touches ? 0.85 : (selected ? 0.06 : 0.22);
      ctx.lineWidth = touches ? 1.6 / view.scale : 0.8 / view.scale;
      ctx.stroke();
    });
    ctx.globalAlpha = 1;

    var showLabels = vn.length <= 220;
    vn.forEach(function (n) {
      var p = positions[n.file]; if (!p) return;
      var r = radius(n);
      var isSel = n.file === selected, isNbr = nbr && nbr.has(n.file), isHov = n.file === hover;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832);
      ctx.fillStyle = communityColor(n.community || 0);
      ctx.globalAlpha = (selected && !isSel && !isNbr) ? 0.28 : 1;
      ctx.fill();
      if (isSel || isHov) { ctx.lineWidth = 2 / view.scale; ctx.strokeStyle = '#fff'; ctx.stroke(); }
      else if (isNbr) { ctx.lineWidth = 1.5 / view.scale; ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.6; ctx.stroke(); }
      ctx.globalAlpha = 1;
      if (showLabels || isSel || isHov) {
        ctx.font = (isSel ? '600 ' : '') + (11 / view.scale) + 'px "JetBrains Mono", monospace';
        ctx.fillStyle = (isSel || isHov) ? '#ededed' : 'rgba(237,237,237,.72)';
        ctx.fillText(n.label, p.x + r + 2 / view.scale, p.y + 3 / view.scale);
      }
    });
    ctx.restore();
    statEl.textContent = vn.length + ' / ' + nodes.length + ' classes · ' + visibleLinks().length + ' edges';
  }

  function s2w(sx, sy) { return { x: (sx - view.tx) / view.scale, y: (sy - view.ty) / view.scale }; }
  function rel(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function fit() {
    var vn = visibleNodes();
    if (!vn.length) { view = { scale: 1, tx: cv.clientWidth / 2, ty: cv.clientHeight / 2 }; requestDraw(); return; }
    var xs = vn.map(function (n) { return positions[n.file].x; }), ys = vn.map(function (n) { return positions[n.file].y; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs), minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var w = Math.max(80, maxX - minX), h = Math.max(80, maxY - minY);
    var s = Math.min(cv.clientWidth / (w + 140), cv.clientHeight / (h + 140), 1.6);
    view.scale = s;
    view.tx = cv.clientWidth / 2 - (minX + maxX) / 2 * s;
    view.ty = cv.clientHeight / 2 - (minY + maxY) / 2 * s;
    requestDraw();
  }

  function hit(sx, sy) {
    var w = s2w(sx, sy), vn = visibleNodes(), best = null, bd = 1e9;
    for (var i = 0; i < vn.length; i++) {
      var p = positions[vn[i].file]; if (!p) continue;
      var d = Math.hypot(p.x - w.x, p.y - w.y), r = radius(vn[i]) + 4 / view.scale;
      if (d <= r && d < bd) { bd = d; best = vn[i]; }
    }
    return best;
  }

  // ---- panel -----------------------------------------------------------
  function updateStat() { requestDraw(); syncPkgChecks(); }

  function addFiles(files) { files.forEach(function (f) { visible.add(f); }); updateStat(); }
  function removeFiles(files) { files.forEach(function (f) { visible.delete(f); }); updateStat(); }
  function toggleFiles(files, on) { on ? addFiles(files) : removeFiles(files); }

  var pkgEls = {};
  function renderPackages(filter) {
    var host = document.getElementById('packages'); host.innerHTML = '';
    filter = (filter || '').toLowerCase();
    pkgOrder.forEach(function (p) {
      if (filter && p.name.toLowerCase().indexOf(filter) === -1) return;
      var el = document.createElement('div'); el.className = 'item';
      var cb = document.createElement('input'); cb.type = 'checkbox';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.name;
      var ct = document.createElement('span'); ct.className = 'ct'; ct.textContent = p.files.length;
      el.appendChild(cb); el.appendChild(nm); el.appendChild(ct);
      el.addEventListener('click', function (e) { if (e.target !== cb) cb.checked = !cb.checked; toggleFiles(p.files, cb.checked); });
      cb.addEventListener('change', function () { toggleFiles(p.files, cb.checked); });
      p._cb = cb; pkgEls[p.name] = cb; host.appendChild(el);
    });
  }
  function syncPkgChecks() {
    pkgOrder.forEach(function (p) {
      if (!p._cb) return;
      var on = 0; p.files.forEach(function (f) { if (visible.has(f)) on++; });
      p._cb.checked = on === p.files.length; p._cb.indeterminate = on > 0 && on < p.files.length;
    });
  }

  var searchTO;
  document.getElementById('search').addEventListener('input', function (e) {
    clearTimeout(searchTO);
    var q = e.target.value.trim().toLowerCase();
    searchTO = setTimeout(function () { renderResults(q); }, 120);
  });
  function renderResults(q) {
    resultsEl.innerHTML = '';
    if (!q) return;
    var hits = nodes.filter(function (n) { return n.label.toLowerCase().indexOf(q) !== -1 || n.file.toLowerCase().indexOf(q) !== -1; }).slice(0, 40);
    if (!hits.length) { var d = document.createElement('div'); d.className = 'item'; d.textContent = 'no match'; resultsEl.appendChild(d); return; }
    hits.forEach(function (n) {
      var el = document.createElement('div'); el.className = 'item';
      el.innerHTML = '<span class="nm"></span><span class="ct">' + n.package.split('.').pop() + '</span>';
      el.querySelector('.nm').textContent = n.label;
      el.addEventListener('click', function () { addFiles([n.file]); selectNode(n); fit(); });
      resultsEl.appendChild(el);
    });
  }

  // ---- details card ----------------------------------------------------
  function selectNode(n) {
    selected = n ? n.file : null; renderCard(); requestDraw();
  }
  function renderCard() {
    var card = document.getElementById('card'), bodyEl = document.getElementById('card-body');
    if (!selected) { card.hidden = true; return; }
    var n = byId[selected], nbr = neighborsOf(selected);
    card.hidden = false;
    bodyEl.innerHTML = '';
    var h = document.createElement('h3'); h.textContent = n.label; bodyEl.appendChild(h);
    var pk = document.createElement('div'); pk.className = 'pkg'; pk.textContent = n.package; bodyEl.appendChild(pk);
    var a = document.createElement('a'); a.className = 'src'; a.href = srcUrl(n.file); a.textContent = 'Open source page →'; bodyEl.appendChild(a);
    var fp = document.createElement('div'); fp.className = 'srcwrap'; fp.textContent = n.file; bodyEl.appendChild(fp);
    var met = document.createElement('div'); met.style.cssText = 'font-size:.7rem;color:var(--text-muted);margin-bottom:8px';
    met.textContent = n.degree + ' connections · community ' + n.community; bodyEl.appendChild(met);
    var btn = document.createElement('button'); btn.className = 'btn'; btn.style.marginBottom = '8px';
    btn.textContent = 'Add ' + nbr.length + ' neighbours';
    btn.addEventListener('click', function () { addFiles(nbr.map(function (x) { return x.file; })); fit(); });
    bodyEl.appendChild(btn);
    var list = document.createElement('div'); list.className = 'nbr';
    nbr.slice(0, 40).forEach(function (x) {
      var s = document.createElement('span'); s.textContent = (byId[x.file] ? byId[x.file].label : x.file) + ' · ' + x.relation;
      s.title = byId[x.file] ? byId[x.file].package : '';
      s.addEventListener('click', function () { addFiles([x.file]); selectNode(byId[x.file]); });
      list.appendChild(s);
    });
    bodyEl.appendChild(list);
  }

  // ---- interactions ----------------------------------------------------
  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var pt = rel(e);
    var f = Math.exp(-e.deltaY * 0.0012);
    var w = s2w(pt.x, pt.y);
    view.scale = Math.max(0.08, Math.min(6, view.scale * f));
    view.tx = pt.x - w.x * view.scale; view.ty = pt.y - w.y * view.scale;
    requestDraw();
  }, { passive: false });

  cv.addEventListener('mousedown', function (e) {
    moved = false;
    var pt = rel(e);
    var n = hit(pt.x, pt.y), w = s2w(pt.x, pt.y);
    if (n) { dragNode = { file: n.file, dx: positions[n.file].x - w.x, dy: positions[n.file].y - w.y }; }
    else { panning = { x: pt.x - view.tx, y: pt.y - view.ty }; }
    cv.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function (e) {
    var pt = rel(e);
    if (dragNode) {
      var w = s2w(pt.x, pt.y); positions[dragNode.file] = { x: w.x + dragNode.dx, y: w.y + dragNode.dy }; moved = true; requestDraw();
    } else if (panning) {
      view.tx = pt.x - panning.x; view.ty = pt.y - panning.y; moved = true; requestDraw();
    } else {
      var h = hit(pt.x, pt.y), id = h ? h.file : null;
      if (id !== hover) { hover = id; cv.style.cursor = h ? 'pointer' : 'grab'; requestDraw(); }
    }
  });
  window.addEventListener('mouseup', function () {
    if (dragNode && !moved) selectNode(byId[dragNode.file]);
    else if (panning && !moved) selectNode(null);
    dragNode = null; panning = null; cv.classList.remove('grabbing');
  });
  cv.addEventListener('dblclick', function (e) {
    var pt = rel(e), n = hit(pt.x, pt.y);
    if (n) window.location.href = srcUrl(n.file);
  });

  document.getElementById('card-close').addEventListener('click', function () { selectNode(null); });
  document.getElementById('btn-fit').addEventListener('click', fit);
  document.getElementById('btn-clear').addEventListener('click', function () { visible.clear(); selectNode(null); updateStat(); });
  document.getElementById('btn-core').addEventListener('click', function () { visible.clear(); CORE.forEach(function (f) { visible.add(f); }); selectNode(null); updateStat(); fit(); });
  document.getElementById('btn-network').addEventListener('click', function () { addFiles(pkgFiles('net.minecraft.network')); fit(); });
  document.getElementById('pkgfilter').addEventListener('input', function (e) { renderPackages(e.target.value); syncPkgChecks(); });
  document.getElementById('toggle-panel').addEventListener('click', function () { document.getElementById('panel').classList.toggle('open'); });
  window.addEventListener('resize', function () { resize(); requestDraw(); });

  function pkgFiles(name) { var p = pkgOrder.filter(function (x) { return x.name === name; })[0]; return p ? p.files : []; }

  function init(data) {
    G = data;
    nodes = data.nodes; links = data.links;
    nodes.forEach(function (n) { byId[n.file] = n; });
    var map = {};
    nodes.forEach(function (n) { (map[n.package] = map[n.package] || []).push(n.file); });
    pkgOrder = Object.keys(map).sort(function (a, b) { return map[b].length - map[a].length; }).map(function (name) { return { name: name, files: map[name] }; });
    pkgNodes = map;
    document.getElementById('pkgcount').textContent = '(' + pkgOrder.length + ')';
    layout();

    // relation chips
    var host = document.getElementById('rels');
    ALL_RELS.forEach(function (r) {
      var s = document.createElement('span'); s.className = 'rel on'; s.textContent = r;
      s.style.background = REL_COLOR[r]; s.style.borderColor = REL_COLOR[r];
      s.addEventListener('click', function () {
        if (rels.has(r)) { rels.delete(r); s.classList.remove('on'); s.style.background = 'transparent'; s.style.color = ''; }
        else { rels.add(r); s.classList.add('on'); s.style.background = REL_COLOR[r]; }
        requestDraw();
      });
      host.appendChild(s);
    });

    renderPackages('');
    // default: the small, readable protocol core
    CORE.forEach(function (f) { visible.add(f); });
    document.getElementById('loading').remove();
    resize(); fit();
  }

  fetch('class-graph.json').then(function (r) { return r.json(); }).then(init).catch(function (e) {
    var l = document.getElementById('loading'); if (l) l.textContent = 'Could not load class-graph.json (' + e.message + ')';
  });
})();
</script>
</body>
</html>
